<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*" />
    <title>TC Staff Management</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.telegram.org" crossorigin />
    <link rel="dns-prefetch" href="https://api.telegram.org" />
    <link rel="dns-prefetch" href="https://telegram.org" />
    <!-- Telegram WebApp JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Instantly notify Telegram that webview is ready to dismiss 4-square skeleton placeholder
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          if (window.Telegram.WebApp.enableClosingConfirmation) {
            window.Telegram.WebApp.enableClosingConfirmation();
          }
          if (window.Telegram.WebApp.disableVerticalSwipes) {
            window.Telegram.WebApp.disableVerticalSwipes();
          }
        }
      } catch (e) {}

      // Handle Vite chunk preload errors when user's Telegram has cached old version
      window.addEventListener('vite:preloadError', function () {
        window.location.reload();
      });
      window.addEventListener('error', function (event) {
        if (event && event.message && (
          event.message.includes('Failed to fetch dynamically imported module') ||
          event.message.includes('Loading chunk') ||
          event.message.includes('error loading dynamically imported module')
        )) {
          window.location.reload();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
